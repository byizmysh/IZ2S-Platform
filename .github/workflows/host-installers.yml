name: Manual experimental host installation checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Windows installation without device or browser actions
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\distribution\install-windows.ps1 -Destination "$env:RUNNER_TEMP\IZ2S trial" -NoShortcut -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare macOS installation without device or browser actions
        if: runner.os == 'macOS'
        run: sh distribution/install-macos.sh --destination "$RUNNER_TEMP/IZ2S trial" --no-shortcut --no-launch
      - name: Windows offline preview
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $Trial = Join-Path $env:RUNNER_TEMP 'IZ2S trial'
          & "$Trial\data\runtime\node\node.exe" "$Trial\distribution\preview-smoke.cjs" $Trial
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: macOS offline preview
        if: runner.os == 'macOS'
        run: '"$RUNNER_TEMP/IZ2S trial/data/runtime/node/bin/node" "$RUNNER_TEMP/IZ2S trial/distribution/preview-smoke.cjs" "$RUNNER_TEMP/IZ2S trial"'
