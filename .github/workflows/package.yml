name: Verify and package IZ2S 0.22
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3-pil glslang-tools spirv-tools libvulkan-dev mesa-vulkan-drivers
      - name: Local regression tests
        run: npm run test:release
      - name: Rebuild launchers and package Linux
        run: python3 distribution/release.py --rebuild
      - uses: actions/upload-artifact@v4
        with:
          name: iz2s-platform-0.22-linux
          if-no-files-found: error
          path: |
            dist/github/*.zip
            dist/github/*.tar.gz
            dist/github/SHA256SUMS
            dist/github/SOURCE-MANIFEST.json
