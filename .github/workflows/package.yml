name: Verify IZ2S for Civilization VII
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify source snapshot and runtime resources
        run: npm run check
      - name: Verify application exports and Civ7 SD archive
        run: node --test tests/release/sd-kit.test.cjs tests/release/stability-defaults.test.cjs tests/release/repository-apps.test.cjs tests/release/loader-probe.test.cjs
      - name: Verify Civ7 session and runtime compatibility
        run: node --test engines/iz2sciv-core/tools/session.test.cjs engines/iz2sciv-core/tools/iz2s.test.mjs engines/iz2sciv-core/tools/persist-verification.test.mjs
      - name: Verify Civ7 UI, save handling and host lifecycle
        run: node --test --test-timeout=15000 distribution/civ7-navigation.test.cjs core/platform/stop-process.test.cjs panel/controller-lifecycle.test.cjs engines/iz2sciv-core/session-lifecycle.test.cjs engines/iz2sciv-core/tools/save-install.test.cjs engines/iz2sciv-core/tools/ui.test.cjs
      - name: Verify PC Link ownership
        run: node --test engines/iz2s-core/tools/pc-link-service.test.cjs
