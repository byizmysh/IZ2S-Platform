[platformio]
name = IZ2S Cardputer ADV Input
build_dir = /tmp/iz21-cardputer-build
libdeps_dir = /tmp/iz21-cardputer-libdeps

[env:cardputer-adv]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:patch_usb.py
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  m5stack/M5Cardputer@1.1.1
  m5stack/M5Unified@0.2.29
  m5stack/M5GFX@0.2.36
  arduino-irremote/IRremote@4.7.1
  bblanchon/ArduinoJson@6.21.5
